services:
  video:
    extends:
      file: docker-compose-base.yml
      service: video
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - 8081:8081

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
    hostname: video-search
    container_name: video-search
    restart: on-failure
    privileged: true
    environment:
      # This puts Elasticsearch into development mode, which skips bootstrap checks
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
      logger.level: 'ERROR'
      xpack.security.enabled: false
      # Reserve space for this local database without requiring a percentage of the host disk.
      cluster.routing.allocation.disk.watermark.low: 10gb
      cluster.routing.allocation.disk.watermark.high: 5gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./../elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300
